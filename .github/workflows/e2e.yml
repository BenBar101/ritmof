name: E2E

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci --no-audit --no-fund

      - name: Verify react-dom CJS files
        run: node -e "const fs=require('fs'); const p='node_modules/react-dom/cjs/react-dom-client.development.js'; if(!fs.existsSync(p)){ console.error('Missing '+p); process.exit(1); }"

      - run: npx playwright install --with-deps

      - name: Run e2e tests
        run: npm run test:e2e
